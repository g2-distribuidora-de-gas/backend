version: '3.8'

services:
  postgres-local:
    image: postgres:16-alpine
    container_name: gas-pedidos-postgres
    environment:
      POSTGRES_DB: pedidos_gas
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pedidos_gas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: gas-pedidos-postgres-data