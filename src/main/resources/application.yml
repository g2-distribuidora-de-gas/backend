spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: pedidos-backend
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 1MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:clave-secreta-de-desarrollo-cambiar-en-produccion-min-64-chars-!!!!}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  supabase:
    storage:
      enabled: ${SUPABASE_STORAGE_ENABLED:false}
      project-ref: ${SUPABASE_PROJECT_REF:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:pedidos-evidencia}
      public-base-url: ${SUPABASE_STORAGE_PUBLIC_BASE_URL:}
      signed-url-ttl-seconds: ${SUPABASE_SIGNED_URL_TTL:3600}
      max-file-size-bytes: 10485760
      allowed-content-types:
        - image/jpeg
        - image/png
        - image/webp

locationiq:
  api-key: ${LOCATIONIQ_API_KEY:}