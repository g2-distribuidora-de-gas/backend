spring:
  datasource:
    url: jdbc:postgresql://${DB_LOCAL_HOST:localhost}:${DB_LOCAL_PORT:5432}/${DB_LOCAL_NAME:pedidos_gas}
    username: ${DB_LOCAL_USER:admin}
    password: ${DB_LOCAL_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  supabase:
    storage:
      enabled: ${SUPABASE_STORAGE_ENABLED:false}
      project-ref: ${SUPABASE_PROJECT_REF:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:pedidos-evidencia}
      public-base-url: ${SUPABASE_STORAGE_PUBLIC_BASE_URL:}

logging:
  level:
    root: INFO
    com.sistemagas.pedidos: DEBUG
    org.hibernate.SQL: DEBUG