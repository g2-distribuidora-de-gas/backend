spring:
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.${SUPABASE_PROJECT_REF:undefined}.supabase.co:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres.${SUPABASE_PROJECT_REF:undefined}}
    password: ${SUPABASE_PASS:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 30000
      max-lifetime: 300000
      keepalive-time: 15000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
      pool-name: SupabasePool
      # Supavisor transaction mode: limita el num de prepared statements por sesion
      data-source-properties:
        prepareThreshold: 0
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
        # Necesario con Supavisor transaction mode para evitar cache de metadata
        temp:
          use_jdbc_metadata_defaults: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

logging:
  level:
    root: INFO
    com.sistemagas.pedidos: INFO
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: INFO

app:
  supabase:
    storage:
      enabled: ${SUPABASE_STORAGE_ENABLED:false}
      project-ref: ${SUPABASE_PROJECT_REF:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:pedidos-evidencia}
      public-base-url: ${SUPABASE_STORAGE_PUBLIC_BASE_URL:}
      max-file-size-bytes: ${SUPABASE_STORAGE_MAX_FILE_SIZE_BYTES:10485760}
      connect-timeout-ms: 5000
      read-timeout-ms: 15000
